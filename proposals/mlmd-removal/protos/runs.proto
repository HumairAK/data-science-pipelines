syntax = "proto3";
import "artifacts.proto";


service RunService {
  rpc CreateTask(CreateTaskRequest) returns (PipelineTaskDetail) {
    option (google.api.http) = {
      post: "/apis/v2beta1/task"
      body: "task"
    };
  }

  rpc UpdateTask(UpdateTaskRequest) returns (PipelineTaskDetail) {
    option (google.api.http) = {
      patch: "/apis/v2beta1/task/{task_id}"
      body: "task"
    };
  }

  rpc GetTask(GetTaskRequest) returns (PipelineTaskDetail) {
    option (google.api.http) = {
      get: "/apis/v2beta1/task/{task_id}"
    };
  }

  rpc ListTasks(ListTasksRequest) returns (ListTasksResponse) {
    option (google.api.http) = {
      get: "/apis/v2beta1/tasks"
    };
  }
}

message CreateTaskRequest {
  PipelineTaskDetail task = 1;
}

message UpdateTaskRequest {
  string task_id = 1;
  PipelineTaskDetail task = 2;
}

message GetTaskRequest {
  string task_id = 1;
}

message ListTasksRequest {
  // Optional, List all tasks with this parent task.
  string parent_id = 1;
  // Optional. List all tasks for this run.
  string run_id = 2;

  int32 page_size = 3;
  string page_token = 4;
  string filter = 5;
  string order_by = 6;
}

message ListTasksResponse {
  repeated PipelineTaskDetail tasks = 1;
  string next_page_token = 2;
  int32 total_size = 3;
}

message PipelineTaskDetail {
  //--------------------------
  // Pre-Existing fields
  //--------------------------
  // This will be changed to Output only.
  string task_id = 2;
  string run_id = 1;
  string display_name = 3;
  google.protobuf.Timestamp create_time = 4;
  google.protobuf.Timestamp start_time = 5;
  google.protobuf.Timestamp end_time = 6;
  RuntimeState state = 8;
  int64 execution_id = 9;
  google.rpc.Status error = 10;
  string parent_task_id = 13;
  repeated RuntimeStatus state_history = 14;
  // This will be changed to Output only.
  // Note also this is applicable only to the Runtime tasks
  string pod_name = 15;

  // Remove these fields
  PipelineTaskExecutorDetail executor_detail = 7;
  map<string, ArtifactList> inputs = 11;
  map<string, ArtifactList> outputs = 12;
  repeated ChildTask child_tasks = 16;

  //--------------------------
  // New fields
  //--------------------------
  repeated string child_tasks_ids = 17;

  enum InputType {
    ResolvedValue = 0;
    PipelineChannel = 1;
  }

  message Parameter {
    InputType input_type = 1;
    string value = 2;

    // Fields for Resolved type
    string name = 3;

    // Fields for PipelineChannel type
    string producer_task_name = 4;
    string producer_parameter_id = 5;
  }
  repeated Parameter input_parameters = 18;
  repeated Parameter output_parameters = 19;

  message TaskArtifact {
    InputType input_type = 1;
    Artifact value = 2;

    // Fields for ResolvedValue type
    string name = 3;

    // Fields for PipelineChannel type
    string producer_task_name = 4;
    string producer_parameter_id = 5;

  }
  repeated TaskArtifact input_artifacts = 20;
  repeated TaskArtifact output_artifacts = 21;

  enum TaskType {
    // Root task replaces Root Execution, it is the top ancestor task to all tasks in the pipeline run
    ROOT = 0;
    RUNTIME = 1;
    CONDITION_BRANCH = 2;
    CONDITION = 3;
    LOOP = 4;
    LOOP_ITERATION = 5;
  }
  TaskType type = 22;

  // Applies to type LOOP_ITERATION
  int64 iteration_index = 23;
  // Applies to type LOOP
  int64 iteration_count = 24;
  string name = 25;
  string cache_fingerprint = 26;
}


message Run {
  // ...
  // This will be added
  // output only
  string pipeline_id = 18;
  // output only
  string pipeline_version_id = 19;
  repeated PipelineTaskDetail tasks = 20;


  // Either remove or deprecate this
  RunDetails run_details = 15;
}
